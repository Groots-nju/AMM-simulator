project:
  name: "AMM MVP Demo"

tokens:
  token0:
    symbol: "ETH"
    name: "Ether"
    decimals: 18
  token1:
    symbol: "USDC"
    name: "USD Coin"
    decimals: 6

pool:
  initial_reserve0: "100"
  initial_reserve1: "200000"
  fee_rate: "0.003"
  initial_lp_owner: "genesis_lp"

events:
  - timestamp: 1
    type: "swap"
    actor: "trader_a"
    token_in: "ETH"
    amount_in: "10"
  - timestamp: 2
    type: "add_liquidity"
    actor: "lp_b"
    amount0: "20"
    amount1: "33066.869476799457703340580488893665214479982143891"
  - timestamp: 3
    type: "external_price_update"
    actor: "market"
    price_token1_per_token0: "2500"
    target_lp_owner: "genesis_lp"

output:
  directory: "outputs/demo_run"
  save_plots: true

visualization:
  enabled: true
